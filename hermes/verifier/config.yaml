# Example Hermes settings for the Sanity Verifier.
# No tokens in this file. These are the keys the Verifier needs; merge them into
# the profile's config.yaml (or let scripts/setup_verifier_docker.sh set them).
#
# Loads:
#   agents/verifier/AGENT.md  — installed as the profile's SOUL.md
#   skills/verify-math        — external_dirs + auto_load (read from the code checkout)
#
# Paths below are the Docker defaults (Hermes data volume at /opt/data).
# On a non-Docker install, use your own paths. See docs/setup-verifier-docker.md.

model:
  provider: "${MODEL_PROVIDER}"
  default: "${MODEL_NAME}"

terminal:
  backend: local
  # The Verifier's scratch folder: one run per <slug>/<attempt>/. Not the code repo.
  cwd: "/opt/data/sanity-verifier/scratch"
  timeout: 180

skills:
  external_dirs:
    - "/opt/data/sanity/skills"   # the sanity code checkout, read-only
  auto_load:
    - verify-math
    - sanity-protocol   # shared message protocol (skills/sanity-protocol)

gateway:
  bot_loop_guard:
    bot_replies_expect_reply: true   # answer the Reader's replies to our questions
    max_hops: 8                      # handoff + up to 3 questions with answers

# Telegram: the token and allowed IDs live in the profile .env, not here
# (TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS). Allowed IDs must include the three
# people, the Reader bot, the Writer bot and the group (docs/telegram.md).
# Set TELEGRAM_REQUIRE_MENTION=true there too. Do not set TELEGRAM_ALLOW_BOTS.
# In @BotFather: privacy off and Bot-to-Bot Communication Mode on.
